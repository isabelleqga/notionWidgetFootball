<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Club Widget</title>
    <style>
        :root {
            /* Notion's default light-mode palette: white page background,
               the light-gray "callout/code block" fill for cards, and
               Notion's signature near-black text color. */
            --bg: #ffffff;
            --surface: #f1f1ef;
            --text: #37352f;
            --text-muted: #787774;
            --border: #e9e9e7;
            --accent: #787774;

            --win: #2f9e44;
            --draw: #868e96;
            --loss: #e03131;
            --upcoming: #d5d8dc;
            --eliminated: #24262b;

            --zone-first: #1c7ed6;
            --zone-top: #2f9e44;
            --zone-mid: #f2b705;
            --zone-relegation: #e03131;

            --warning-bg: #fff8e6;
            --warning-text: #8a6300;
            --warning-border: #f0dca3;

            --error-bg: #fdecec;
            --error-text: #b42318;
            --error-border: #f3c6c4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Notion's default dark-mode palette: the same near-black
                   page background and subtle gray card fill Notion uses. */
                --bg: #191919;
                --surface: #2f2f2f;
                --text: #e6e6e6;
                --text-muted: #9b9b9b;
                --border: #373737;
                --accent: #9b9b9b;

                --win: #4caf50;
                --draw: #9298a1;
                --loss: #ef5350;
                --upcoming: #34373c;
                --eliminated: #0b0c0d;

                --zone-first: #4dabf7;
                --zone-top: #4caf50;
                --zone-mid: #ffd43b;
                --zone-relegation: #ef5350;

                --warning-bg: #2b2410;
                --warning-text: #e0c473;
                --warning-border: #4a3d18;

                --error-bg: #2c1615;
                --error-text: #f28b82;
                --error-border: #4a2523;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .container.mode-wide {
            max-width: none;
        }

        .toggle-selector-btn {
            display: inline-block;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            flex-shrink: 0;
        }

        .toggle-selector-btn:hover {
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 30px;
            height: 30px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
        }

        .icon-btn:hover {
            color: var(--text);
        }

        .layout-picker {
            position: relative;
        }

        .layout-menu {
            position: absolute;
            right: 0;
            top: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 10;
            min-width: 140px;
        }

        .layout-option {
            background: none;
            border: none;
            text-align: left;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
        }

        .layout-option:hover {
            background: var(--bg);
        }

        .layout-option.active {
            font-weight: 700;
        }

        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-muted);
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--text);
            border-color: var(--accent);
        }

        #content-sections.mode-side-by-side {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            align-items: start;
        }

        #content-sections.mode-side-by-side .section {
            margin-bottom: 0;
        }

        /* Default (Scroll/Tabs): the League section is one card; its two
           .league-column groups (Table, and Position progress + Form) just
           stack in place, preserving the original spacing between them. */
        #league-section > .league-column + .league-column {
            margin-top: 20px;
        }

        /* Side-by-side only: unwrap the League section's own card so its two
           .league-column groups become independent grid cells alongside
           Matches / Champions League, each styled as its own card. */
        #content-sections.mode-side-by-side #league-section {
            display: contents;
        }

        #content-sections.mode-side-by-side #league-info-title {
            display: none;
        }

        #content-sections.mode-side-by-side .league-column {
            margin-top: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 22px;
        }

        .selector-row {
            display: flex;
            gap: 10px;
        }

        .selector-row select {
            flex: 1;
            min-width: 0;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            font-family: inherit;
        }

        .selector-row select:disabled {
            color: var(--text-muted);
        }

        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .section-title-row .section-title {
            padding-bottom: 0;
            margin-bottom: 0;
            border-bottom: none;
        }

        .subsection {
            margin-top: 20px;
        }

        .subsection:first-of-type {
            margin-top: 0;
        }

        .subtitle {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
        }

        .match {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .match:last-child {
            border-bottom: none;
        }

        .match-date {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .match-date-competition {
            font-size: 10px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .match-body {
            flex: 1;
            min-width: 0;
        }

        .match-opponent {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .match-opponent .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score {
            background: var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            min-width: 50px;
            text-align: center;
            flex-shrink: 0;
        }

        .score.upcoming {
            color: var(--text-muted);
        }

        .score.win { background: var(--win); color: #fff; }
        .score.draw { background: var(--draw); color: #fff; }
        .score.loss { background: var(--loss); color: #fff; }

        .league-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .table-header {
            border-bottom: 1px solid var(--border);
        }

        .table-header th {
            padding: 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .table-header th:nth-child(1) { width: 5%; }
        .table-header th:nth-child(2) { width: 50%; }
        .table-header th:nth-child(3) { width: 15%; text-align: center; }
        .table-header th:nth-child(4) { width: 15%; text-align: center; }
        .table-header th:nth-child(5) { width: 15%; text-align: center; }

        .table-row {
            border-bottom: 1px solid var(--border);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-row td {
            padding: 10px;
            font-size: 13px;
        }

        .table-row.our-team {
            background: var(--bg);
            font-weight: 600;
        }

        .position {
            color: var(--text);
            font-weight: 600;
        }

        .team-name {
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .points {
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--error-border);
            margin-bottom: 20px;
        }

        .last-updated {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .position-chart-wrap svg {
            display: block;
        }

        .chart-grid {
            stroke: var(--border);
        }

        .chart-line {
            stroke: var(--accent);
        }

        .chart-dot {
            fill: var(--accent);
        }

        .chart-label {
            fill: var(--text);
            font-size: 10px;
            font-weight: 600;
            text-anchor: middle;
        }

        .chart-dot.zone-first { fill: var(--zone-first); }
        .chart-dot.zone-top { fill: var(--zone-top); }
        .chart-dot.zone-mid { fill: var(--zone-mid); }
        .chart-dot.zone-relegation { fill: var(--zone-relegation); }

        .position-pill {
            display: inline-block;
            background: var(--bg);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            margin-top: 10px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 14px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .squares {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .squares-rows {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .squares-rows .squares {
            flex-wrap: nowrap;
        }

        /* Keep both form rows on exactly one line each, shrinking each
           square (rather than wrapping or overflowing) when the section
           is too narrow to fit them all at their natural size. */
        .squares-rows .sq {
            flex-shrink: 1;
            min-width: 0;
            height: auto;
            aspect-ratio: 1 / 1;
        }

        #cl-form {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            row-gap: 10px;
            column-gap: 18px;
        }

        .phase-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sq,
        .legend-swatch {
            background: var(--upcoming);
        }

        .sq {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            color: var(--text-muted);
        }

        .sq.win, .legend-swatch.win { background: var(--win); border-color: var(--win); }
        .sq.draw, .legend-swatch.draw { background: var(--draw); border-color: var(--draw); }
        .sq.loss, .legend-swatch.loss { background: var(--loss); border-color: var(--loss); }
        .sq.eliminated, .legend-swatch.eliminated { background: var(--eliminated); }
        .sq.filler { background: #000; border-color: #000; }

        .sq.win, .sq.draw, .sq.loss, .sq.eliminated {
            color: #fff;
        }

        .phase-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* Notion columns can be as narrow as ~240px when a page is split
           three-plus ways — reclaim space and stack the selectors instead
           of squeezing everything sideways. */
        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .section {
                padding: 14px;
            }

            .section-title,
            .section-title-row {
                padding-bottom: 8px;
                margin-bottom: 10px;
            }

            .selector-row {
                flex-direction: column;
            }

            .match-date-competition {
                display: none;
            }

            .match-date {
                font-size: 11px;
            }

            .score {
                min-width: 40px;
                padding: 6px 8px;
                font-size: 13px;
            }

            .table-header th {
                padding: 6px;
                font-size: 11px;
            }

            .table-row td {
                padding: 6px;
                font-size: 12px;
            }

            .sq {
                width: 14px;
                height: 14px;
                font-size: 8px;
            }

            .legend {
                gap: 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Layout mode picker -->
        <div class="toolbar">
            <div class="layout-picker">
                <button type="button" id="layout-settings-btn" class="icon-btn" title="Layout settings">⚙</button>
                <div class="layout-menu" id="layout-menu" style="display: none;">
                    <button type="button" class="layout-option" data-mode="scroll">Scroll</button>
                    <button type="button" class="layout-option" data-mode="tabs">Tabs</button>
                    <button type="button" class="layout-option" data-mode="side-by-side">Side-by-side</button>
                </div>
            </div>
        </div>

        <!-- Club selector -->
        <div class="section" id="selector-section">
            <div class="selector-row">
                <select id="country-select">
                    <option value="">Country…</option>
                </select>
                <select id="club-select" disabled>
                    <option value="">Club…</option>
                </select>
            </div>
        </div>

        <!-- Error Messages -->
        <div id="error-container"></div>

        <!-- Tab bar (shown only in "tabs" layout mode) -->
        <div class="tab-bar" id="tab-bar" style="display: none;">
            <button type="button" class="tab-btn" data-tab="matches-section">Matches</button>
            <button type="button" class="tab-btn" data-tab="league-section">League</button>
            <button type="button" class="tab-btn" id="cl-tab-btn" data-tab="cl-section" style="display: none;">Champions League</button>
        </div>

        <div id="content-sections">
            <!-- Matches -->
            <div class="section" id="matches-section">
                <div class="section-title-row">
                    <div class="section-title" id="matches-title">Matches</div>
                    <button type="button" id="toggle-selector-btn" class="toggle-selector-btn">Hide selector</button>
                </div>
                <div id="matches-list" class="empty-state">Pick a club above to see matches</div>
            </div>

            <!-- League Info: table, position progress, form. In side-by-side
                 mode this splits into 2 independent cards (.league-column);
                 in Scroll/Tabs it's one unified "League" section. -->
            <div class="section" id="league-section">
                <div class="section-title" id="league-info-title">League</div>

                <div class="league-column" id="league-col-table">
                    <div class="subsection">
                        <div class="subtitle">Table</div>
                        <div id="league-table" class="empty-state">Pick a club above to see standings</div>
                        <div class="last-updated" id="last-updated"></div>
                    </div>
                </div>

                <div class="league-column" id="league-col-position-form">
                    <div class="subsection">
                        <div class="subtitle">Position progress</div>
                        <div id="position-chart" class="empty-state position-chart-wrap">Pick a club above to see position history</div>
                    </div>

                    <div class="subsection">
                        <div class="subtitle">Form</div>
                        <div class="legend">
                            <span class="legend-item"><span class="legend-swatch win"></span>Win</span>
                            <span class="legend-item"><span class="legend-swatch draw"></span>Draw</span>
                            <span class="legend-item"><span class="legend-swatch loss"></span>Loss</span>
                            <span class="legend-item"><span class="legend-swatch"></span>Upcoming</span>
                        </div>
                        <div id="league-form" class="empty-state">Pick a club above to see recent form</div>
                    </div>
                </div>
            </div>

            <!-- Champions League Form Squares (hidden if not applicable) -->
            <div class="section" id="cl-section" style="display: none;">
                <div class="section-title">Champions League</div>
                <div class="subsection">
                    <div class="subtitle">Form</div>
                    <div class="legend">
                        <span class="legend-item"><span class="legend-swatch win"></span>Win</span>
                        <span class="legend-item"><span class="legend-swatch draw"></span>Draw</span>
                        <span class="legend-item"><span class="legend-swatch loss"></span>Loss</span>
                        <span class="legend-item"><span class="legend-swatch"></span>Upcoming</span>
                        <span class="legend-item"><span class="legend-swatch eliminated"></span>Out</span>
                    </div>
                    <div id="cl-form"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🔧 CONFIGURE YOUR BACKEND URL HERE:
        // Local testing: 'http://localhost:3000'
        // Replit: 'https://your-replit-name.replit.dev'
        // Vercel: 'https://your-vercel-app.vercel.app'
        // Heroku: 'https://your-heroku-app.herokuapp.com'
        const backendUrl = 'http://localhost:3000';

        const STORAGE_KEY = 'football-widget-selection';
        const LAYOUT_STORAGE_KEY = 'football-widget-layout-mode';
        const CONTENT_SECTION_IDS = ['matches-section', 'league-section', 'cl-section'];

        let currentTeamId = null;
        let currentCompetition = null;
        let currentTeamShortName = null;
        let leaguesByCountry = {};
        let competitionToCountry = {};
        let layoutMode = 'scroll';
        let activeTabId = 'matches-section';
        let clApplicable = false;

        function saveSelection(competition, teamId) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ competition, teamId }));
            } catch (e) {
                // localStorage unavailable (private browsing, etc.) — selection just won't persist
            }
        }

        function loadSavedSelection() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function setSelectorVisible(visible) {
            document.getElementById('selector-section').style.display = visible ? '' : 'none';
            document.getElementById('toggle-selector-btn').textContent = visible ? 'Hide selector' : 'Change club';
        }

        function saveLayoutMode(mode) {
            try {
                localStorage.setItem(LAYOUT_STORAGE_KEY, mode);
            } catch (e) {
                // localStorage unavailable — layout choice just won't persist
            }
        }

        function loadLayoutMode() {
            try {
                const saved = localStorage.getItem(LAYOUT_STORAGE_KEY);
                return ['scroll', 'tabs', 'side-by-side'].includes(saved) ? saved : 'scroll';
            } catch (e) {
                return 'scroll';
            }
        }

        // Single source of truth reconciling layout mode, active tab, and
        // whether Champions League is applicable for the current club.
        function refreshLayout() {
            const container = document.getElementById('container');
            const contentSections = document.getElementById('content-sections');
            const tabBar = document.getElementById('tab-bar');
            const clTabBtn = document.getElementById('cl-tab-btn');

            const isSideBySide = layoutMode === 'side-by-side';
            contentSections.classList.toggle('mode-side-by-side', isSideBySide);
            container.classList.toggle('mode-wide', isSideBySide);
            tabBar.style.display = layoutMode === 'tabs' ? 'flex' : 'none';
            clTabBtn.style.display = clApplicable ? '' : 'none';

            if (activeTabId === 'cl-section' && !clApplicable) {
                activeTabId = 'matches-section';
            }

            CONTENT_SECTION_IDS.forEach(id => {
                const el = document.getElementById(id);
                if (id === 'cl-section' && !clApplicable) {
                    el.style.display = 'none';
                    return;
                }
                el.style.display = (layoutMode === 'tabs' && id !== activeTabId) ? 'none' : '';
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === activeTabId);
            });
            document.querySelectorAll('.layout-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === layoutMode);
            });
        }

        function initLayoutControls() {
            layoutMode = loadLayoutMode();

            document.getElementById('layout-settings-btn').addEventListener('click', () => {
                const menu = document.getElementById('layout-menu');
                menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
            });

            document.querySelectorAll('.layout-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    layoutMode = btn.dataset.mode;
                    saveLayoutMode(layoutMode);
                    document.getElementById('layout-menu').style.display = 'none';
                    refreshLayout();
                });
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeTabId = btn.dataset.tab;
                    refreshLayout();
                });
            });

            refreshLayout();
        }

        async function initSelectors() {
            const countrySelect = document.getElementById('country-select');
            const clubSelect = document.getElementById('club-select');

            const saved = loadSavedSelection();
            document.getElementById('toggle-selector-btn').addEventListener('click', () => {
                setSelectorVisible(document.getElementById('selector-section').style.display === 'none');
            });
            setSelectorVisible(!saved);

            try {
                const res = await fetch(`${backendUrl}/api/leagues`);
                const data = await res.json();

                leaguesByCountry = {};
                competitionToCountry = {};
                data.leagues.forEach(l => {
                    (leaguesByCountry[l.country] = leaguesByCountry[l.country] || []).push(l);
                    competitionToCountry[l.code] = l.country;
                });

                const countries = Object.keys(leaguesByCountry).sort();
                countrySelect.innerHTML = '<option value="">Country…</option>' +
                    countries.map(c => `<option value="${c}">${c}</option>`).join('');
            } catch (e) {
                console.error('Failed to load leagues:', e);
                showError('❌ Could not reach the backend. Make sure it is running on ' + backendUrl);
                return;
            }

            countrySelect.addEventListener('change', () => onCountryChange(countrySelect.value));
            clubSelect.addEventListener('change', () => onClubChange(clubSelect.value));

            if (saved && competitionToCountry[saved.competition]) {
                countrySelect.value = competitionToCountry[saved.competition];
                await onCountryChange(countrySelect.value, saved);
            }
        }

        async function onCountryChange(country, preselect) {
            const clubSelect = document.getElementById('club-select');
            clubSelect.disabled = true;
            clubSelect.innerHTML = '<option value="">Loading clubs…</option>';

            if (!country) {
                clubSelect.innerHTML = '<option value="">Club…</option>';
                return;
            }

            const codes = leaguesByCountry[country].map(l => l.code);
            try {
                const results = await Promise.all(codes.map(code =>
                    fetch(`${backendUrl}/api/clubs?competition=${code}`).then(r => r.json())
                ));

                const clubs = [];
                results.forEach((r, i) => {
                    (r.clubs || []).forEach(c => clubs.push({ ...c, competition: codes[i] }));
                });
                clubs.sort((a, b) => a.name.localeCompare(b.name));

                clubSelect.innerHTML = '<option value="">Club…</option>' +
                    clubs.map(c => `<option value="${c.competition}|${c.id}">${c.name}</option>`).join('');
                clubSelect.disabled = false;

                if (preselect) {
                    const value = `${preselect.competition}|${preselect.teamId}`;
                    if ([...clubSelect.options].some(o => o.value === value)) {
                        clubSelect.value = value;
                        await onClubChange(value);
                    }
                }
            } catch (e) {
                console.error('Failed to load clubs:', e);
                showError('❌ Could not load clubs for ' + country);
            }
        }

        async function onClubChange(value) {
            if (!value) return;
            const [competition, teamIdStr] = value.split('|');
            const teamId = parseInt(teamIdStr, 10);
            saveSelection(competition, teamId);
            await loadClubData(competition, teamId);
        }

        async function loadClubData(competition, teamId) {
            currentCompetition = competition;
            currentTeamId = teamId;

            setLoadingState();

            try {
                const response = await fetch(`${backendUrl}/api/club-data?teamId=${teamId}&competition=${competition}`);
                if (!response.ok) {
                    throw new Error(`Backend error: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    showError('API Error: ' + data.error);
                    return;
                }

                currentTeamShortName = data.team.shortName || data.team.name;

                document.getElementById('matches-title').textContent = `Matches • ${data.team.name}`;
                document.getElementById('league-info-title').textContent = data.league.name;

                const allMatches = [
                    ...(data.league.matches || []),
                    ...((data.championsLeague && data.championsLeague.matches) || [])
                ];

                renderMatchesList(allMatches);
                displayStandings(data.league.standings);
                renderPositionChart(data.league.positionHistory, data.league.teamCount, data.league.relegationZone);
                renderLeagueForm(data.league.form);
                renderClForm(data.championsLeague);

                updateLastUpdated();
            } catch (error) {
                console.error('Fetch error:', error);
                showError('❌ Error loading data. Make sure the backend is running on ' + backendUrl);
            }
        }

        function setLoadingState() {
            document.getElementById('error-container').innerHTML = '';
            [
                ['matches-list', 'Loading matches...'],
                ['league-table', 'Loading standings...'],
                ['position-chart', 'Loading position history...'],
                ['league-form', 'Loading form...'],
            ].forEach(([id, label]) => {
                const el = document.getElementById(id);
                el.className = id === 'position-chart' ? 'loading position-chart-wrap' : 'loading';
                el.innerHTML = `<div class="spinner"></div>${label}`;
            });
        }

        function renderMatchesList(matches) {
            const container = document.getElementById('matches-list');

            const past = matches
                .filter(m => m.status === 'FINISHED')
                .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate))
                .slice(0, 2)
                .reverse();

            const upcoming = matches
                .filter(m => m.status === 'SCHEDULED' || m.status === 'TIMED')
                .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate))
                .slice(0, 2);

            const combined = [...past, ...upcoming];

            container.className = combined.length > 0 ? '' : 'empty-state';
            container.innerHTML = combined.length > 0
                ? combined.map(m => createMatchHTML(m, m.status === 'FINISHED')).join('')
                : '<div class="empty-state">No matches to show</div>';
        }

        function createMatchHTML(match, isFinished) {
            const isHome = match.homeTeam.id === currentTeamId;
            const opponent = isHome ? match.awayTeam.name : match.homeTeam.name;
            const date = new Date(match.utcDate);
            const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

            let scoreHTML;
            if (isFinished) {
                const ourGoals = isHome ? match.score.fullTime.home : match.score.fullTime.away;
                const theirGoals = isHome ? match.score.fullTime.away : match.score.fullTime.home;
                let result = 'draw';
                if (ourGoals > theirGoals) result = 'win';
                else if (ourGoals < theirGoals) result = 'loss';
                scoreHTML = `<div class="score ${result}">${match.score.fullTime.home} - ${match.score.fullTime.away}</div>`;
            } else {
                scoreHTML = `<div class="score upcoming">${timeStr}</div>`;
            }

            return `
                <div class="match">
                    <div class="match-date">
                        <div>${dateStr}</div>
                        <div class="match-date-competition">${match.competition.name}</div>
                    </div>
                    <div class="match-body">
                        <div class="match-opponent">
                            <span class="sq upcoming">${isHome ? 'H' : 'A'}</span>
                            <span class="name">${opponent}</span>
                        </div>
                    </div>
                    ${scoreHTML}
                </div>
            `;
        }

        function displayStandings(table) {
            const container = document.getElementById('league-table');
            container.className = '';
            const ourIndex = table.findIndex(t => t.team.id === currentTeamId);

            // Show a 5-team window centered on our club, clamped to the table's edges
            // (e.g. 1st shows 4 below, last shows 4 above, 2nd-to-last shows 3 above + 1 below).
            const windowSize = Math.min(5, table.length);
            let start = ourIndex === -1 ? 0 : ourIndex - 2;
            start = Math.max(0, Math.min(start, table.length - windowSize));
            const displayTable = table.slice(start, start + windowSize);

            const tableHTML = `
                <table class="league-table">
                    <thead class="table-header">
                        <tr>
                            <th>#</th>
                            <th>Team</th>
                            <th>P</th>
                            <th>GD</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${displayTable.map(team => {
                            const isOurs = team.team.id === currentTeamId;
                            const name = isOurs ? currentTeamShortName : team.team.name;
                            return `
                                <tr class="table-row ${isOurs ? 'our-team' : ''}">
                                    <td class="position">${team.position}</td>
                                    <td class="team-name">${name}</td>
                                    <td class="points">${team.playedGames}</td>
                                    <td class="points">${team.goalDifference > 0 ? '+' : ''}${team.goalDifference}</td>
                                    <td class="points"><strong>${team.points}</strong></td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        function positionColorClass(pos, teamCount, relegationZone) {
            if (pos === 1) return 'zone-first';
            if (pos <= 4) return 'zone-top';
            if (relegationZone && pos > teamCount - relegationZone) return 'zone-relegation';
            return 'zone-mid';
        }

        function renderPositionChart(history, teamCount, relegationZone) {
            const container = document.getElementById('position-chart');
            container.className = 'position-chart-wrap';

            if (!history || history.length === 0) {
                container.className = 'empty-state';
                container.innerHTML = 'No matches played yet';
                return;
            }

            // Draw at the container's actual rendered width so dot/text sizes
            // stay legible at any width — a fixed 560-unit viewBox would get
            // scaled down by the browser at narrow widths, shrinking text
            // unreadably small.
            const width = Math.max(container.clientWidth, 200);
            const height = Math.round(width * 0.3), padding = 24;
            const minPos = 1, maxPos = teamCount || 20;
            const n = history.length;
            const xStep = n > 1 ? (width - padding * 2) / (n - 1) : 0;
            const xFor = (i) => padding + i * xStep;
            const yFor = (pos) => padding + ((pos - minPos) / (maxPos - minPos)) * (height - padding * 2);

            const points = history.map((h, i) => `${xFor(i)},${yFor(h.position)}`).join(' ');
            const dots = history.map((h, i) => {
                const cls = positionColorClass(h.position, maxPos, relegationZone);
                return `<circle class="chart-dot ${cls}" cx="${xFor(i)}" cy="${yFor(h.position)}" r="3.5"><title>Matchday ${h.matchday}: #${h.position}</title></circle>` +
                    `<text class="chart-label" x="${xFor(i)}" y="${yFor(h.position) - 10}">${h.position}</text>`;
            }).join('');
            const last = history[history.length - 1];

            container.innerHTML = `
                <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
                    <line class="chart-grid" x1="${padding}" y1="${yFor(minPos)}" x2="${width - padding}" y2="${yFor(minPos)}" stroke-width="1" />
                    <line class="chart-grid" x1="${padding}" y1="${yFor(maxPos)}" x2="${width - padding}" y2="${yFor(maxPos)}" stroke-width="1" />
                    <polyline class="chart-line" points="${points}" fill="none" stroke-width="2" />
                    ${dots}
                </svg>
                <div style="text-align: center;">
                    <span class="position-pill">Currently #${last.position} · matchday ${last.matchday}</span>
                </div>
            `;
        }

        function squareClass(state) {
            return 'sq ' + (['win', 'loss', 'draw', 'eliminated', 'filler'].includes(state) ? state : 'upcoming');
        }

        function squareTitle(sq) {
            if (sq.opponent) {
                const date = new Date(sq.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const score = sq.score ? ` (${sq.score.home}-${sq.score.away})` : '';
                return `${date} vs ${sq.opponent}${score}`;
            }
            if (sq.state === 'filler') return '';
            return sq.state === 'eliminated' ? 'Not reached' : 'Not yet scheduled';
        }

        function renderSquares(container, squares) {
            container.innerHTML = squares.map(sq => {
                const letter = sq.home === true ? 'H' : sq.home === false ? 'A' : '';
                return `<div class="${squareClass(sq.state)}" title="${squareTitle(sq)}">${letter}</div>`;
            }).join('');
        }

        function renderLeagueForm(form) {
            const container = document.getElementById('league-form');
            if (!form || form.length === 0) {
                container.className = 'empty-state';
                container.innerHTML = 'No matches yet';
                return;
            }
            container.className = 'squares-rows';

            // Always split into two equal-length rows; pad with a filler
            // square (never drop a real match) when the total is odd.
            const filler = { state: 'filler', opponent: null, home: null, date: null, score: null };
            const padded = form.length % 2 === 0 ? form : [filler, ...form];
            const half = padded.length / 2;
            const rows = [padded.slice(0, half), padded.slice(half)];
            container.innerHTML = rows.map((_, i) => `<div class="squares" id="league-form-row-${i}"></div>`).join('');
            rows.forEach((row, i) => renderSquares(document.getElementById(`league-form-row-${i}`), row));
        }

        function renderClForm(championsLeague) {
            const container = document.getElementById('cl-form');

            clApplicable = !!(championsLeague && championsLeague.phases && championsLeague.phases.length > 0);
            if (!clApplicable) {
                refreshLayout();
                return;
            }

            container.innerHTML = championsLeague.phases.map(phase => `
                <div class="phase-row">
                    <div class="phase-label">${phase.label}</div>
                    <div class="squares" id="phase-${phase.stage}"></div>
                </div>
            `).join('');

            championsLeague.phases.forEach(phase => {
                renderSquares(document.getElementById(`phase-${phase.stage}`), phase.squares);
            });
            refreshLayout();
        }

        function updateLastUpdated() {
            const now = new Date();
            document.getElementById('last-updated').textContent = `Updated: ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        initLayoutControls();
        initSelectors();

        // Refresh the currently selected club's data every 5 minutes
        setInterval(() => {
            if (currentTeamId && currentCompetition) {
                loadClubData(currentCompetition, currentTeamId);
            }
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
